[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "footshellgaussian-foot-prior"
version = "0.1.0"
description = "Deterministic SUPR support fitting in prepared shoes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "trimesh>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]
fitting = ["torch>=1.13"]
volume = [
    "gmsh==4.15.2",
    "pymeshfix==0.18.1",
    "scipy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["foot_prior*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
